<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OdontoCare - Appointment</title>
<link rel="stylesheet" href="style.css" />
<script type="module" src="https://cdn.jsdelivr.net/npm/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://cdn.jsdelivr.net/npm/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body>
  <div class="phone">

    <div class="top-bar">
      <a href="index.html" class="icon-btn"><ion-icon name="arrow-back"></ion-icon></a>
      <h1>Appointment</h1>
      <button class="icon-btn"><ion-icon name="ellipsis-vertical"></ion-icon></button>
    </div>

    <div class="doctor-detail-row">
      <div>
        <p class="credentials">CRO-SP 12345</p>
        <p class="doctor-detail-name">Dra. Emma<br>Wilson</p>
        <span class="specialty-tag">Ortodontista</span>
      </div>
      <div class="doctor-detail-avatar"><ion-icon name="person"></ion-icon></div>
    </div>

    <div class="stats-row">
      <div class="stat">
        <p class="stat-label">Rating</p>
        <p class="stat-value">4.9</p>
      </div>
      <div class="stat">
        <p class="stat-label">Anos</p>
        <p class="stat-value">12+</p>
      </div>
      <div class="stat">
        <p class="stat-label">Pacientes</p>
        <p class="stat-value">2.4k</p>
      </div>
    </div>

    <div class="date-card">
      <div class="date-header">
        <span class="month">April, 2026</span>
        <span class="weekday">Thursday</span>
      </div>
      <p class="date-number">30</p>
      <button class="book-btn">
        <ion-icon name="calendar-outline"></ion-icon>
        Agendar Consulta
      </button>
    </div>

  </div>
</body>
</html>
