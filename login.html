<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OdontoCare - Entrar</title>
<link rel="stylesheet" href="style.css" />
<script type="module" src="https://cdn.jsdelivr.net/npm/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://cdn.jsdelivr.net/npm/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body>
  <div class="phone login-phone">

    <div class="login-hero">
      <div class="login-logo">
        <ion-icon name="medkit"></ion-icon>
      </div>
      <h1 class="login-title">OdontoCare</h1>
      <p class="login-subtitle">Área exclusiva para dentistas</p>
    </div>

    <form class="login-form" id="login-form">
      <label class="field-label" for="email">E-mail</label>
      <div class="field">
        <ion-icon name="mail-outline"></ion-icon>
        <input type="email" id="email" placeholder="voce@email.com" required />
      </div>

      <label class="field-label" for="password">Senha</label>
      <div class="field">
        <ion-icon name="lock-closed-outline"></ion-icon>
        <input type="password" id="password" placeholder="••••••••" required />
      </div>

      <button type="submit" class="primary-btn" id="submit-btn">Entrar</button>

      <p class="signup-text">
        Não tem conta? <a href="signup.html" class="signup-link">Criar conta</a>
      </p>
    </form>

    <div id="feedback" class="feedback-box feedback-error" style="display:none;"></div>

  </div>

  <script type="module">
    import { loginDentist } from './firebase-init.js';

    const form = document.getElementById('login-form');
    const feedback = document.getElementById('feedback');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Entrando...';
      feedback.style.display = 'none';

      try {
        await loginDentist(
          document.getElementById('email').value,
          document.getElementById('password').value
        );
        window.location.href = 'profile.html';
      } catch (err) {
        feedback.style.display = 'block';
        feedback.textContent = 'E-mail ou senha incorretos.';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
